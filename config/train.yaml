# 데이터 컬럼
dataloader:
  columns:
    ohlcv_cols:
      - "open"
      - "high"
      - "low"
      - "close"
      - "volume"
      - "quote_volume"
      - "count"
      - "taker_buy_volume"
      - "taker_buy_quote_volume"
    target_cols: null  # 자동 생성: [f"l_{i}" for i in range(20)] + [f"s_{i}" for i in range(20)]
    
  n_bins: 20          # 히스토그램 구간 수
  ohlcv_dim: 9          # OHLCV 데이터 차원

# 모델 설정
model:
  select: "hbt"

  # 학습 설정
  training:
    batch_size: 512       # 배치 크기
    num_epochs: 100       # 에폭 수
    learning_rate: 0.001  # 학습률
    patience: 20         # 조기 종료 대기 에폭 수
    val_ratio: 0.1       # 검증 데이터 비율
    device: "cuda:3"       # 학습 장치 (cuda 또는 cpu)

    # 텐서보드 설정
    tensorboard:
      enabled: true       # 텐서보드 활성화 여부
      port: 8888          # 텐서보드 실행 포트
      log_dir: "runs"     # 텐서보드 로그 디렉토리
    
  # HBT 모델 구조
  hbt:
    action_dim: 40         # 행동 분포 차원 (20 롱 + 20 숏)
    hidden_dim: 256         # 은닉층 차원 크기
    output_dim: 40         # 출력 차원 (행동 분포와 동일)
    context_length: 240      # 컨텍스트 창의 시간 단계 수
    num_heads: 8           # 어텐션 헤드 수
    dropout: 0.1           # 드롭아웃 비율
    use_other_player_beliefs: true  # 다른 플레이어 신념 사용 여부
    
    # 벤치마크 모델 설정
    benchmark:
      enabled: true        # 벤치마크 모델 사용 여부
    
    # 모델 저장/로드 경로
    save_path:
      proposed: "best_hbt_model.pth"
      benchmark: "best_hbt_benchmark.pth"

