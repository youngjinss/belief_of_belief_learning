[project]
name = "belief-multirl"
version = "0.1.0"
description = "Multi-agent RL with belief modeling, built on the ToMnet architecture"
requires-python = ">=3.9"

# The `beliefrl` core package is introduced in Phase 2 of the refactor, when the
# shared core is extracted from script/exp8. Until then this file exists to
# carry tool configuration only, and deliberately declares no build backend so
# that nothing about the current import behaviour changes.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py39"
