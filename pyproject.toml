[project]
name = "belief-multirl"
version = "0.1.0"
description = "Multi-agent RL with belief modeling, built on the ToMnet architecture"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "beliefrl",
    "beliefrl.agents",
    "beliefrl.agents.achiever",
    "beliefrl.agents.blocker",
    "beliefrl.config",
    "beliefrl.env",
    "beliefrl.model",
]

# `pip install -e .` puts beliefrl on the path, after which the per-script
# sys.path bootstraps under script/ become unnecessary.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py39"
